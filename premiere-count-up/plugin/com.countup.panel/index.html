<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Count Up</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="preview" width="640" height="360"></canvas>

  <label class="full">Text
    <textarea id="text" rows="2" spellcheck="false">10,000</textarea>
  </label>
  <p class="hint" id="modeHint"></p>

  <div class="grid">
    <label>Effect
      <select id="mode">
        <option value="auto">Auto</option>
        <option value="count">Count up numbers</option>
        <option value="roll">Letter roll</option>
        <option value="type">Typewriter</option>
      </select>
    </label>
    <label>Count from
      <input id="from" type="number" value="0">
    </label>
    <label>Duration (s)
      <input id="duration" type="number" value="3" min="0.2" step="0.1">
    </label>
    <label>Hold end (s)
      <input id="hold" type="number" value="2" min="0" step="0.1">
    </label>
    <label>Easing
      <select id="ease">
        <option value="ease-out">Ease out</option>
        <option value="ease-in-out">Ease in-out</option>
        <option value="ease-out-back">Overshoot</option>
        <option value="linear">Linear</option>
      </select>
    </label>
    <label>Font
      <input id="font" list="fonts" value="Arial">
      <datalist id="fonts">
        <option>Arial</option><option>Arial Black</option><option>Impact</option>
        <option>Helvetica Neue</option><option>Segoe UI</option><option>Montserrat</option>
        <option>Bebas Neue</option><option>Roboto</option><option>Georgia</option>
        <option>Courier New</option>
      </datalist>
    </label>
    <label>Weight
      <select id="weight">
        <option value="400">Regular</option>
        <option value="600">Semibold</option>
        <option value="700" selected>Bold</option>
        <option value="900">Black</option>
      </select>
    </label>
    <label>Size (px)
      <input id="size" type="number" value="200" min="8">
    </label>
    <label>Color
      <input id="color" type="color" value="#ffffff">
    </label>
    <label>Letter spacing
      <input id="tracking" type="number" value="0" step="1">
    </label>
    <label>Align
      <select id="align">
        <option value="center">Center</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>
    </label>
    <label>Vertical position (%)
      <input id="posY" type="number" value="50" min="0" max="100">
    </label>
    <label class="check"><input id="italic" type="checkbox"> Italic</label>
    <label class="check"><input id="shadow" type="checkbox" checked> Drop shadow</label>
  </div>

  <button id="add">Add to timeline</button>
  <div class="bar"><div id="progress"></div></div>
  <p class="status" id="status"></p>

  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
