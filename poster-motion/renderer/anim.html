<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url(anton.woff2) format("woff2"); }
html,body { margin:0; background:#000; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, FPS = 30, DURATION = 9.5;
const RED = "rgb(148,2,3)", BORDER = 22;
// Red panel edge: y = 1489 - 0.792x (everything below it is the red box).
const LINE_C = 1489, LINE_M = 0.792;

const c = document.getElementById("c"), ctx = c.getContext("2d");
const off = document.createElement("canvas"); off.width = W; off.height = H;
const octx = off.getContext("2d");
const img = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
let plate, overlay;

const clamp = v => Math.max(0, Math.min(1, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = p => 1 - Math.pow(1 - p, 3);
const eInOut = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const eBack = p => { const k = 1.7; return 1 + (k + 1) * Math.pow(p - 1, 3) + k * Math.pow(p - 1, 2); };
const rand = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

// ---------- layout taken from the poster ----------
const NAME_ROWS = [
  { y0: 1303, y1: 1440, cells: [[265,362],[365,401],[403,501],[504,589],[589,686],[690,726],[727,823]] },  // GIORGIA
  { y0: 1443, y1: 1580, cells: [[275,371],[372,465],[467,564],[566,602],[609,696],[703,764],[768,803]] },  // ANGIULI
];
const SMALL = [
  { text: "(LIVE)", x0: 811, x1: 885, y0: 1546, y1: 1586, start: 6.25, end: 6.85 },
  { text: "HALLOWEEN WEEKEND", x0: 366, x1: 713, y0: 1588, y1: 1623, start: 6.1, end: 7.0 },
];
const LOCATION = [315, 255, 790, 370], DATE = [350, 375, 728, 437];
const TOP = [[60,118,330,207],[380,118,700,207],[820,118,1020,207]];
const BOTTOM = [[420,1673,560,1787],[560,1673,700,1787]];

function piece(r, dx = 0, dy = 0, alpha = 1, scale = 1) {
  const [x0, y0, x1, y1] = r, w = x1 - x0, h = y1 - y0;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  const cx = x0 + w / 2 + dx, cy = y0 + h / 2 + dy;
  ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.drawImage(overlay, x0, y0, w, h, -w / 2, -h / 2, w, h);
  ctx.restore();
}

// Slide up from behind an invisible edge (masked reveal).
function maskedRise(r, p, dist) {
  if (p <= 0) return;
  const [x0, y0, x1, y1] = r;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0 - 10, y0 - 10, x1 - x0 + 20, y1 - y0 + 20); ctx.clip();
  piece(r, 0, (1 - eOut(p)) * dist, clamp(p * 1.6));
  ctx.restore();
}

function rollGlyph(ch, x0, x1, y0, y1, alpha) {
  const capH = y1 - y0;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#fff";
  ctx.font = (capH * 0.93 / 0.86) + "px Anton"; // Anton cap height is 0.86 em
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  // Anton is lighter than the poster's face, so thicken it with a matching stroke.
  ctx.strokeStyle = "#fff"; ctx.lineWidth = capH * 0.07; ctx.lineJoin = "round";
  const mw = Math.max(1, (x1 - x0) - ctx.lineWidth);
  ctx.strokeText(ch, (x0 + x1) / 2, y1 - ctx.lineWidth / 2, mw);
  ctx.fillText(ch, (x0 + x1) / 2, y1 - ctx.lineWidth / 2, mw);
  ctx.restore();
}

// One letter cell: rolls through random letters, then lands as the real poster letter.
function letterCell(t, frame, x0, x1, y0, y1, start, land, seed) {
  if (t < start) return;
  if (t < land) {
    rollGlyph(ABC[Math.floor(rand(seed, Math.floor(frame / 2)) * 26)], x0, x1, y0, y1, 1);
    return;
  }
  const p = prog(t, land, land + 0.18);
  const s = 1 + 0.12 * (1 - eOut(p));
  piece([x0 - 2, y0 - 2, x1 + 2, y1 + 2], 0, 0, 1, s);
}

function smallText(t, frame, item, idx) {
  // Cells sized in proportion to Anton's advances across the original word's width.
  ctx.font = "100px Anton";
  const adv = [...item.text].map(ch => ctx.measureText(ch).width);
  const total = adv.reduce((a, b) => a + b, 0);
  let x = item.x0;
  [...item.text].forEach((ch, i) => {
    const w = adv[i] / total * (item.x1 - item.x0);
    const n = item.text.length;
    if (ch !== " ") {
      const start = item.start + (i / n) * (item.end - item.start) * 0.5;
      const land = item.start + 0.25 + (i / n) * (item.end - item.start - 0.25);
      if (t >= start && t < land) {
        const pool = /[A-Z]/.test(ch) ? ABC : ch;
        const g = pool.length > 1 ? pool[Math.floor(rand(idx * 100 + i, Math.floor(frame / 2)) * 26)] : ch;
        rollGlyph(g, x, x + w, item.y0 + 4, item.y1 - 4, 1);
      } else if (t >= land) {
        piece([Math.floor(x), item.y0, Math.ceil(x + w), item.y1]);
      }
    }
    x += w;
  });
}

function drawBorder(t) {
  const trace = eInOut(prog(t, 1.2, 2.4));
  if (trace <= 0) return;
  const grow = eOut(prog(t, 2.3, 2.8));
  const lw = 4 + (BORDER - 4) * grow, inset = lw / 2;
  // Two strokes start at top-centre and meet at bottom-centre.
  const wv = W - 2 * inset, hv = H - 2 * inset, half = wv + hv;
  const len = trace * half;
  ctx.save();
  ctx.strokeStyle = RED; ctx.lineWidth = lw; ctx.lineCap = "square";
  ctx.setLineDash([len, 99999]);
  for (const dir of [1, -1]) {
    ctx.beginPath();
    ctx.moveTo(W / 2, inset);
    ctx.lineTo(W / 2 + dir * wv / 2, inset);
    ctx.lineTo(W / 2 + dir * wv / 2, H - inset);
    ctx.lineTo(W / 2, H - inset);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPhoto(t) {
  const fade = eOut(prog(t, 0.4, 1.5));
  if (fade <= 0) return;
  // Grey half of the photo always; the red box is wiped in from the bottom-right corner.
  const wipe = eInOut(prog(t, 2.75, 3.55));
  const far = H + LINE_M * W - LINE_C; // line offset at the far corner
  const off2 = (1 - wipe) * far;
  octx.clearRect(0, 0, W, H);
  octx.save();
  octx.beginPath();
  // Above the line.
  octx.moveTo(0, 0); octx.lineTo(W, 0); octx.lineTo(W, LINE_C - LINE_M * W); octx.lineTo(0, LINE_C); octx.closePath();
  if (wipe > 0) {
    // Below the shifted line: y + m*x - c > off2
    const c2 = LINE_C + off2;
    octx.moveTo(0, c2); octx.lineTo(W, c2 - LINE_M * W); octx.lineTo(W, H + 2000); octx.lineTo(0, H + 2000); octx.closePath();
  }
  octx.clip();
  octx.drawImage(plate, 0, 0);
  octx.restore();

  const s = 1.1 - 0.1 * eOut(prog(t, 0.4, 2.4)) + 0.025 * prog(t, 2.4, DURATION);
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.beginPath(); ctx.rect(BORDER, BORDER, W - 2 * BORDER, H - 2 * BORDER); ctx.clip();
  ctx.translate(W / 2, 900); ctx.scale(s, s); ctx.translate(-W / 2, -900);
  ctx.drawImage(off, 0, 0);
  // Bright line that draws along the diagonal before the box fills.
  const lp = eInOut(prog(t, 2.3, 2.95)), lfade = 1 - prog(t, 3.4, 3.8);
  if (lp > 0 && lfade > 0) {
    ctx.globalAlpha = lfade;
    ctx.strokeStyle = "rgb(225,20,26)"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, LINE_C);
    ctx.lineTo(lp * W, LINE_C - LINE_M * lp * W); ctx.stroke();
  }
  ctx.restore();
}

window.renderFrame = function (frame) {
  const t = frame / FPS;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  drawPhoto(t);
  drawBorder(t);

  // Location logo and date.
  maskedRise(LOCATION, prog(t, 3.4, 4.1), 70);
  const dp = prog(t, 3.8, 4.35);
  if (dp > 0) piece(DATE, 0, 0, clamp(dp * 2), 0.5 + 0.5 * eBack(dp));

  // Artist name rolls in, letter by letter.
  let idx = 0;
  NAME_ROWS.forEach(row => row.cells.forEach(([x0, x1]) => {
    letterCell(t, frame, x0, x1, row.y0, row.y1, 5.1 + idx * 0.04, 5.65 + idx * 0.07, idx + 1);
    idx++;
  }));
  SMALL.forEach((item, i) => smallText(t, frame, item, i + 1));

  // Partner logos: top and bottom rows together, before the name.
  TOP.forEach((r, i) => { const p = prog(t, 4.3 + i * 0.12, 4.9 + i * 0.12); if (p > 0) piece(r, 0, -(1 - eOut(p)) * 30, p); });
  BOTTOM.forEach((r, i) => { const p = prog(t, 4.4 + i * 0.12, 5.0 + i * 0.12); if (p > 0) piece(r, 0, (1 - eOut(p)) * 30, p); });
  return c.toDataURL("image/png");
};
window.TOTAL_FRAMES = Math.round(DURATION * FPS);
window.ready = (async () => {
  [plate, overlay] = await Promise.all([img("plate.png"), img("overlay.png")]);
  await document.fonts.load("100px Anton");
  return true;
})();
</script></body></html>
